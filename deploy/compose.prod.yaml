# Live server (VPS). Run from the project root:
#   cp .env.example .env    # set AUTH_SECRET, POSTGRES_PASSWORD, HEALING_URL, SHOP_URL, hosts, API keys
#   docker compose --env-file .env -f deploy/compose.prod.yaml up -d --build
#   docker compose --env-file .env -f deploy/compose.prod.yaml exec web npx tsx scripts/seed.ts --if-empty   # first deploy only
# Put Nginx (deploy/nginx.conf) in front for HTTPS.
name: pure-conscious-healing

services:
  db:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: pch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pch -d pch"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://pch:${POSTGRES_PASSWORD}@db:5432/pch
      MEDIA_DIR: /app/storage/uploads
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (32+ random characters)}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - media:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/admin/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
  media:
