# /etc/nginx/sites-available/pch  — both domains proxy to the same app; it picks the site by Host.
# Get certificates with:  sudo certbot --nginx -d pureconscioushealing.com -d www.pureconscioushealing.com -d purecrystalhub.com -d www.purecrystalhub.com

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name pureconscioushealing.com www.pureconscioushealing.com purecrystalhub.com www.purecrystalhub.com;

  client_max_body_size 320m;   # video uploads from the admin media library
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}
